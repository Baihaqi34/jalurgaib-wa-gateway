services:
  # 1. MySQL Database
  database:
    image: mysql:8.0
    container_name: wa_gateway_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wa_gateway
      MYSQL_USER: waguser
      MYSQL_PASSWORD: secretpassword
      MYSQL_ROOT_PASSWORD: rootsecretpassword
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - wa_network

  # 2. Go WhatsApp Service Engine (whatsmeow)
  wa-service:
    build:
      context: ./wa-service
      dockerfile: Dockerfile
    container_name: wa_gateway_engine
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - INTERNAL_API_KEY=dev-secret-internal-key
      - DB_PATH=/app/data/whatsapp.db
      - LARAVEL_WEBHOOK_URL=http://backend:9000/api/webhooks/whatsapp/inbound
    volumes:
      - wa_data:/app/data
    networks:
      - wa_network

  # 3. Laravel 11 Backend (PHP-FPM)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wa_gateway_backend
    restart: unless-stopped
    depends_on:
      - database
      - wa-service
    environment:
      - APP_NAME="WA Gateway"
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=http://localhost
      - DB_CONNECTION=mysql
      - DB_HOST=database
      - DB_PORT=3306
      - DB_DATABASE=wa_gateway
      - DB_USERNAME=waguser
      - DB_PASSWORD=secretpassword
      - WA_SERVICE_URL=http://wa-service:8080
      - WA_SERVICE_API_KEY=dev-secret-internal-key
      - QUEUE_CONNECTION=database
    volumes:
      - ./backend/storage:/var/www/html/storage
    networks:
      - wa_network

  # 4. Laravel Queue Worker (Pemroses Antrean Pesan 24/7)
  queue:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wa_gateway_queue
    restart: unless-stopped
    command: php artisan queue:work --tries=3 --timeout=90 --sleep=2
    depends_on:
      - backend
      - database
      - wa-service
    environment:
      - APP_NAME="WA Gateway Queue"
      - APP_ENV=production
      - DB_CONNECTION=mysql
      - DB_HOST=database
      - DB_PORT=3306
      - DB_DATABASE=wa_gateway
      - DB_USERNAME=waguser
      - DB_PASSWORD=secretpassword
      - WA_SERVICE_URL=http://wa-service:8080
      - WA_SERVICE_API_KEY=dev-secret-internal-key
      - QUEUE_CONNECTION=database
    volumes:
      - ./backend/storage:/var/www/html/storage
    networks:
      - wa_network

  # 5. Nginx Web Server
  webserver:
    image: nginx:alpine
    container_name: wa_gateway_web
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - wa_network

volumes:
  db_data:
  wa_data:

networks:
  wa_network:
    driver: bridge
